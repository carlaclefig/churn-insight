services:

  # ─── Backend Spring Boot ──────────────────────────────────
  backend:
    build:
      context: ./backend/springboot-app
      dockerfile: Dockerfile
    container_name: churn-backend
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      - churn-network
    restart: unless-stopped

  # ─── Frontend React ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend/web-app
      dockerfile: Dockerfile
    container_name: churn-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - churn-network
    restart: unless-stopped

networks:
  churn-network:
    driver: bridge